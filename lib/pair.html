    // ==================== SORT AND POPULATE DROPDOWN ====================
    function populateCountryCodes() {
      // Sort by code (numeric)
      countryCodes.sort((a, b) => {
        const numA = parseInt(a.code.replace('+', ''));
        const numB = parseInt(b.code.replace('+', ''));
        return numA - numB;
      });

      const select = document.getElementById('countryCode');
      
      // Add default option
      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = 'Select Country Code';
      defaultOption.disabled = true;
      defaultOption.selected = true;
      select.appendChild(defaultOption);
      
      // Add all countries
      countryCodes.forEach(country => {
        const option = document.createElement('option');
        option.value = country.code.replace('+', '');
        option.textContent = `${country.code} ${country.name}`;
        select.appendChild(option);
      });
      
      // Auto-detect user's country (if possible)
      if (navigator.language) {
        try {
          const userCountry = navigator.language.split('-')[1]?.toUpperCase();
          // Try to find matching country code
          for (const country of countryCodes) {
            if (country.name.includes(userCountry) || country.name.includes(userCountry?.toLowerCase())) {
              select.value = country.code.replace('+', '');
              break;
            }
          }
        } catch (e) {
          // Fallback to default
          select.value = '92'; // Pakistan as fallback
        }
      }
    }

        waiting: 'status-waiting',
        loading: 'status-info'
      };
      statusBox.innerHTML = `<span class="${classes[type] || 'status-info'}">${icons[type] || 'ℹ️'} ${message}</span>`;
    }

    function setLoading(message) {
      statusBox.innerHTML = `<span class="loading"></span><span class="status-info">${message}</span>`;
    }

    function updateBadge(status, text) {
      const classes = {
        online: 'badge-online',
        offline: 'badge-offline',
        pairing: 'badge-pairing'
      };
      const texts = {
        online: '● Online',
        offline: '● Offline',
        pairing: '● Pairing...'
      };
      statusBadge.innerHTML = `<span class="badge ${classes[status] || 'badge-offline'}">${texts[status] || texts.offline}</span>`;
    }

    async function checkStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        
        if (data.paired) {
          updateBadge('online');
          setStatus('✅ Bot is connected and running!', 'success');
          qrContainer.style.display = 'none';
          pairBtn.disabled = true;
          pairBtn.textContent = '✅ Connected';
          if (statusInterval) {
            clearInterval(statusInterval);
            statusInterval = null;
          }
          return;
        }
        
        if (data.qr) {
          updateBadge('pairing');
          qrContainer.style.display = 'block';
          qrImage.src = data.qr;
          setStatus('📱 Scan the QR code with WhatsApp', 'info');
        } else {
          updateBadge('offline');
        }
      } catch (e) {
        console.error('Status check error:', e);
      }
    }

    // Format phone number input
    phoneInput.addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
      
      // Auto format for common countries
      const code = countrySelect.value;
      if (code === '92' && this.value.length === 0) {
        this.placeholder = '3xxxxxxxxx';
      } else if (code === '91' && this.value.length === 0) {
        this.placeholder = '9xxxxxxxxx';
      } else if (code === '1' && this.value.length === 0) {
        this.placeholder = '2025550123';
      } else if (code === '44' && this.value.length === 0) {
        this.placeholder = '7xxxxxxxxx';
      } else {
        this.placeholder = 'Enter phone number';
      }
    });

    // Update placeholder when country changes
    countrySelect.addEventListener('change', function() {
      phoneInput.dispatchEvent(new Event('input'));
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const number = phoneInput.value.trim();
      const code = countrySelect.value;
      
      if (!code) {
        setStatus('Please select a country code', 'error');
        return;
      }
      
      if (!number || number.length < 6) {
        setStatus('Please enter a valid phone number', 'error');
        return;
      }
      
      const fullNumber = code + number;
      
      pairBtn.disabled = true;
      pairBtn.textContent = '⏳ Pairing...';
      setLoading('Requesting pairing code...');
      updateBadge('pairing');
      
      try {
        const response = await fetch('/api/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: fullNumber })
        });
        
        const data = await response.json();
        
        if (data.success) {
          setStatus('📱 Check your WhatsApp for the pairing code', 'waiting');
          qrContainer.style.display = 'none';
          
          if (statusInterval) clearInterval(statusInterval);
          statusInterval = setInterval(checkStatus, 3000);
          
          setTimeout(checkStatus, 2000);
        } else {
          setStatus('❌ ' + (data.error || 'Pairing failed'), 'error');
          pairBtn.disabled = false;
          pairBtn.textContent = '🔗 Pair Device';
          updateBadge('offline');
        }
      } catch (error) {
        setStatus('❌ Error: ' + error.message, 'error');
        pairBtn.disabled = false;
        pairBtn.textContent = '🔗 Pair Device';
        updateBadge('offline');
      }
    });

    // ==================== INITIALIZE ====================
    // Populate country codes
    populateCountryCodes();
    
    // Initial status check
    checkStatus();
    setInterval(checkStatus, 5000);
  </script>
</body>
</html>
